# Dharohar: app + PostgreSQL on one machine.
#   npm run secrets > .env.production   (then add BOOTSTRAP_ADMIN_EMAIL / BOOTSTRAP_ADMIN_PASSWORD)
#   docker compose --env-file .env.production up --build -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dharohar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dharohar}
      POSTGRES_DB: dharohar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dharohar -d dharohar"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://dharohar:${POSTGRES_PASSWORD:-dharohar}@postgres:5432/dharohar
      JWT_SECRET: ${JWT_SECRET:?run npm run secrets}
      INTEGRATION_SERVICE_KEY: ${INTEGRATION_SERVICE_KEY:?run npm run secrets}
      CERT_SIGNING_KEY: ${CERT_SIGNING_KEY:?run npm run secrets}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OCR_ENGINE: ${OCR_ENGINE:-auto}
      GEOCODER: ${GEOCODER:-none}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    volumes:
      - appdata:/data

volumes:
  pgdata:
  appdata:
