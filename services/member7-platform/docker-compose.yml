# Dharohar stack — Member 6 API (database/GIS/audit) on PostgreSQL + PostGIS.
#
# From this directory:
#   cp .env.example .env
#   docker compose up --build
#
# Next.js: MEMBER6_DATABASE_API_URL=http://localhost:8005

services:

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: dharohar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dharohar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dharohar}
      POSTGRES_DB: ${POSTGRES_DB:-dharohar}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dharohar} -d ${POSTGRES_DB:-dharohar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    build:
      context: ..
      dockerfile: member7-platform/backend/Dockerfile
      target: runtime
    container_name: dharohar-db-init
    command: ["python", "scripts/init_db.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dharohar}:${POSTGRES_PASSWORD:-dharohar}@postgres:5432/${POSTGRES_DB:-dharohar}
      STORAGE_BASE_DIR: /app/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: member7-platform/backend/Dockerfile
      target: runtime
    container_name: dharohar-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8005}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dharohar}:${POSTGRES_PASSWORD:-dharohar}@postgres:5432/${POSTGRES_DB:-dharohar}
      STORAGE_BASE_DIR: /app/storage
    volumes:
      - storage_data:/app/storage
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  storage_data:
  uploads_data:
